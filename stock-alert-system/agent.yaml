name: "stock-alert-system"
version: "1.0.0"
description: "Real-time stock/crypto alerts via Telegram. Never miss a price target."
price: 19
type: "premium"
requires: "hermes>=4.0"
entry: "skill.py"
author: "Hermesplayground2"
license: "commercial"
commands:
  - name: "set-alert"
    description: "Set a price alert for a stock or crypto"
    pattern: "(stock|price) alert (set|add|create|watch) (.+)"
  - name: "list-alerts"
    description: "List all active alerts"
    pattern: "(list|show|my) alerts"
  - name: "cancel-alert"
    description: "Cancel a specific alert"
    pattern: "(remove|delete|cancel) alert (.+)"
config:
  check_interval_seconds: 60
  notification_provider: "telegram"
  price_tolerance: 0.01
  volume_threshold: 1000000
